name: Collector local validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-validation:
    name: Local execution spine
    runs-on: windows-latest
    defaults:
      run:
        working-directory: poc

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install isolated Chromium
        run: npx playwright install chromium

      # This is intentionally local-only. It first runs the L1/L2 Vitest
      # projects and the L3 production-dist Playwright suite, then preserves
      # the existing local validation spine. It never runs a live platform
      # Canary or loads a user-managed browser Profile.
      - name: Run layered Collector validation
        run: npm run verify:collector
