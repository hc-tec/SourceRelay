name: SourceRelay Core release candidate

on:
  push:
    tags:
      - 'core-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-verify:
    name: Package and verify Core release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Package Core release directory
        run: npm run package:core-release

      - name: Verify clean release candidate
        run: npm run verify:release-candidate

      - name: Verify SDK installation from release artifacts
        run: npm run verify:sdk-release-installation

      - name: Upload Core release directory
        uses: actions/upload-artifact@v4
        with:
          name: sourcerelay-core-release-0.7.17-${{ github.sha }}
          path: poc/runtime/core-release-0.7.17
          if-no-files-found: error
          retention-days: 14

      - name: Read verified release metadata
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./runtime/core-release-0.7.17/release-manifest.json').releaseVersion")"
          test "$version" = "0.7.17"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=core-v$version" >> "$GITHUB_OUTPUT"

      - name: Archive verified Core release directory
        run: |
          tar -czf "runtime/sourcerelay-core-${{ steps.release.outputs.version }}.tar.gz" \
            -C runtime "core-release-${{ steps.release.outputs.version }}"

      # A manual run and a core-v* tag are both intentional release events for
      # this workflow. softprops/action-gh-release creates the tag on a manual
      # run when it does not exist, and updates the same release on reruns.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SourceRelay Core ${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            poc/runtime/sourcerelay-core-${{ steps.release.outputs.version }}.tar.gz
            poc/runtime/core-release-${{ steps.release.outputs.version }}/release-manifest.json
            poc/runtime/core-release-${{ steps.release.outputs.version }}/sha256sums.json
