events {}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    server {
        listen 5005;
        client_max_body_size 0;

        location /v2/ {
            # docker.1panel.live serves registry GET requests correctly but
            # currently rejects Docker's manifest HEAD probe. Fetch upstream
            # metadata with GET while nginx still returns a body-less HEAD
            # response to the local Docker daemon.
            proxy_method GET;
            proxy_pass http://host.docker.internal:5006;
            proxy_set_header Host host.docker.internal:5006;
        }
    }
}
