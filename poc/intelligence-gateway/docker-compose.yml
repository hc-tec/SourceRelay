services:
  newsnow:
    image: ghcr.io/ourongxing/newsnow:latest
    container_name: intelligence-newsnow
    restart: unless-stopped
    ports:
      - "127.0.0.1:4444:4444"
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - INIT_TABLE=true
      - ENABLE_CACHE=true
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4444/api/latest').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: intelligence-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./runtime/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/search?q=healthcheck&format=json', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

volumes:
  newsnow_data:
