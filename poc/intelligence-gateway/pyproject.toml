[project]
name = "intelligence-gateway"
version = "0.13.0"
description = "Unified, explicit-status gateway for Chinese public-information sources."
requires-python = ">=3.11"
dependencies = [
  "aiotieba==4.7.1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "yt-dlp>=2026.7.4,<2027",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
